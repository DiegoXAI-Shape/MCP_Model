name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Generar cartera sintetica
        run: python seed.py
      - name: Pruebas
        run: pytest -q
