[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cobranza"
version = "0.1.0"
description = "Servidor MCP sobre una cartera de cobranza sintética, con un host que genera interfaces mínimas bajo demanda."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1",
    "anthropic>=1.3",
    "faker>=40",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools]
py-modules = ["seed", "tools_core", "server", "host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
